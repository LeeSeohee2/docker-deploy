# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4

    - name: Java 17 설치
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Maven 빌드
      run: ./mvnw clean package -DskipTests

    - name: Docker 이미지 빌드
      run: docker build -t day70-springboot .

    - name: 빌드 완료
      run: echo "✅ 빌드 성공!"